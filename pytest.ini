[pytest]
testpaths = inventory-hub/tests
python_files = test_*.py
# A run that names the repo root (`pytest .`) recurses through every folder. These hold scripts,
# copies of the suite with their own conftest.py (review-samples), captures and docs, not tests, and
# some act at import (until 2026-11-13, importing utilities/test_assignment.py sent two PATCHes to
# prod Spoolman).
# This replaces pytest's default list, so its entries come first (.* covers .captures, .git, .claude).
norecursedirs =
    .* *.egg _darcs build CVS dist node_modules venv {arch}
    .captures _backup artifacts docs inventory-hub-scanner-unused ptouch-data-pullers
    review-samples setup-and-rebuild utilities
addopts = --browser chromium --base-url http://localhost:8000
markers =
    integration: hits real dev Spoolman at 192.168.1.29:7913 — skipped by default; opt-in via --run-integration or RUN_INTEGRATION=1
filterwarnings =
    ignore::DeprecationWarning
